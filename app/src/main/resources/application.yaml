app:
  database: ${APP_DATABASE:mongodb}
server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: Product-APi

---
spring:
  config:
    activate:
      on-profile: mongo
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/productsDB}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/productsDB}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
